name: NFS server
description: Export /srv/nfs from the runner and set NFS_SERVER to its address

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "Kernel: $(uname -r)"
        sudo apt-get update -q
        sudo apt-get install -y -q nfs-kernel-server nfs-common
        sudo mkdir -p /srv/nfs
        sudo chmod 777 /srv/nfs
        echo '/srv/nfs *(rw,sync,no_subtree_check,no_root_squash,insecure)' | sudo tee /etc/exports
        sudo exportfs -ra
        sudo systemctl restart nfs-server
        echo "NFS_SERVER=$(hostname -I | awk '{print $1}')" >> "$GITHUB_ENV"
